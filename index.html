<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15325e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-title" content="Karne"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Kızıltoprak Karne</title>

<style>
/* Düzen: tek kolon saha aracı — üstte gün seçici, iki sekme (Asistan / Ekipler), skorlar 1–5 renk şeridiyle */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --sunk:#e8ecf0; --line:#d5dbe2;
  --fg:#16202b; --muted:#5a6876; --accent:#1f5fbf; --accent-fg:#ffffff; --accent-soft:#e3ecfa;
  --s0:#aab4bf; --s1:#d1432f; --s2:#e5801f; --s3:#d9b31c; --s4:#7cb342; --s5:#2e8b57;
  --c1:#1f5fbf; --c2:#d1432f; --c3:#2e8b57; --c4:#8e44ad; --c5:#e5801f; --c6:#0b8a9a; --e101:#3b6fd4; --e102:#8e44ad; --e103:#0b8a9a; --e104:#c07a12; --e106:#5a7d1a; --e118:#c2185b; --e119:#7a5446; --e506:#4f6470;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#161e27; --sunk:#1d2732; --line:#2a3644;
  --fg:#e4eaf0; --muted:#93a1b0; --accent:#6ea2f0; --accent-fg:#0b1420; --accent-soft:#1b2a40;
  --s0:#56616d; --s1:#ef6a55; --s2:#f2a04b; --s3:#e6c84a; --s4:#9ccc65; --s5:#4fbf82;
  --c1:#6ea2f0; --c2:#ef6a55; --c3:#4fbf82; --c4:#b98be0; --c5:#f2a04b; --c6:#3cc4d4; --e101:#7aa5f0; --e102:#c08ae6; --e103:#3cc4d4; --e104:#f0b04a; --e106:#9ccc65; --e118:#f06292; --e119:#c49a8a; --e506:#9fb3bf;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#161e27; --sunk:#1d2732; --line:#2a3644;
  --fg:#e4eaf0; --muted:#93a1b0; --accent:#6ea2f0; --accent-fg:#0b1420; --accent-soft:#1b2a40;
  --s0:#56616d; --s1:#ef6a55; --s2:#f2a04b; --s3:#e6c84a; --s4:#9ccc65; --s5:#4fbf82;
  --c1:#6ea2f0; --c2:#ef6a55; --c3:#4fbf82; --c4:#b98be0; --c5:#f2a04b; --c6:#3cc4d4; --e101:#7aa5f0; --e102:#c08ae6; --e103:#3cc4d4; --e104:#f0b04a; --e106:#9ccc65; --e118:#f06292; --e119:#c49a8a; --e506:#9fb3bf;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.brand h1{font-family:var(--f-head);font-size:22px;line-height:1.1;margin:0;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.day{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--f-num);font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;width:100%}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--s1)}

/* ekip şeridi */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (min-width:640px){.strip{grid-template-columns:repeat(8,minmax(0,1fr))}}
.chipT{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;gap:1px}
.chipT b{font-family:var(--f-num);font-size:15px}
.chipT small{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.chipT .d{font-size:11px}
.up{color:var(--s5)} .dn{color:var(--s1)}

/* sohbet */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{min-width:0}
.msg.user{align-self:flex-end;max-width:88%;background:var(--accent);color:var(--accent-fg);padding:9px 13px;border-radius:14px 14px 4px 14px;white-space:pre-wrap}
.msg.ai{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.msg.ai .think{color:var(--muted);font-style:italic}
.md h1,.md h2,.md h3,.md h4{font-family:var(--f-head);line-height:1.2;margin:14px 0 6px;text-wrap:balance}
.md h1{font-size:20px}.md h2{font-size:18px}.md h3{font-size:16px}.md h4{font-size:15px}
.md > :first-child{margin-top:0}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:20px}
.md li{margin:2px 0}

.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0}
.tw{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px}
.md table,.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.md th,.md td,.tbl th,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.md td:first-child,.md th:first-child{white-space:normal}
.md th,.tbl th{background:var(--sunk);font-weight:600;font-size:12.5px;letter-spacing:.02em}
.md tr:last-child td,.tbl tr:last-child td{border-bottom:0}
.md td{font-variant-numeric:tabular-nums}
.chart{margin:10px 0;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel)}
.chart h5{margin:0 0 4px;font-size:13.5px;font-family:var(--f-head)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13.5px;text-align:left}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.ask{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;min-height:46px;max-height:160px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.intro p{margin:0;color:var(--muted);font-size:14px}

/* ekip kartları */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .no{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1}
.card .who{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pp{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card .pp b{font-family:var(--f-num);font-size:18px}
.card .pp small{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.03em}
.bars{display:flex;gap:2px;height:6px}
.bars span{flex:1;border-radius:2px}
.detail{display:flex;flex-direction:column;gap:12px}
.dhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dhead .no{font-family:var(--f-num);font-size:30px;font-weight:600}
.kpi{display:flex;flex-direction:column}
.kpi small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--f-num);font-size:20px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--s0);border-radius:8px;padding:9px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline}
.row .k{font-family:var(--f-num);font-weight:600;font-size:13.5px}
.row .ad{min-width:0;font-size:14px}
.row .val{font-family:var(--f-num);font-size:14px;text-align:right}
.row .sub{grid-column:2 / 4;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.sc{display:inline-block;min-width:22px;text-align:center;border-radius:5px;font-family:var(--f-num);font-weight:600;font-size:12.5px;color:#fff;padding:0 5px}
.s0{background:var(--s0)}.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3);color:#2a2100}.s4{background:var(--s4);color:#14240a}.s5{background:var(--s5)}
.bl0{border-left-color:var(--s0)}.bl1{border-left-color:var(--s1)}.bl2{border-left-color:var(--s2)}.bl3{border-left-color:var(--s3)}.bl4{border-left-color:var(--s4)}.bl5{border-left-color:var(--s5)}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:20px minmax(0,1.25fr) minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;width:100%}
.trow:hover{border-color:var(--accent)}
.trow .rk{color:var(--muted);font-size:13px}
.trow .tn{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;min-width:0}
.trow .tn b{font-size:18px;line-height:1.2}
.trow .tn small{flex-basis:100%;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tb{display:flex;flex-direction:column;gap:3px;min-width:0}
.trow .tb .bars{height:7px}
.trow .tb .sp{display:block;height:22px}
.trow .tb .sp svg{display:block}
.trow .tb small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tp{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.trow .tp b{font-size:20px}
.trow .tp small{font-size:12px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.lhead .sect{margin:0}
.full{position:fixed;inset:0;z-index:30;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.finner{max-width:720px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fhead b{font-family:var(--f-head);font-size:18px;display:block;line-height:1.2}
.fhead span{font-size:12.5px;color:var(--muted)}
.fhead .btn{white-space:nowrap;flex:none}
.full .tlist{flex:1;min-height:0;gap:5px}
.full .trow{flex:1 1 0;min-height:0;padding:3px 12px;overflow:hidden}
.fleg{font-size:11.5px;color:var(--muted);text-align:center}
.dsum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dsum h3,.dcard h3{margin:0;font-family:var(--f-head);font-size:16px;line-height:1.25}
.trk{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.trk b{font-family:var(--f-num)}
.trk .bar{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.trk .bar span{height:100%}
.trk small{color:var(--muted);grid-column:2 / 4;margin-top:-4px;font-size:12px}
.dlist{display:flex;flex-direction:column;gap:8px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.dcard.kotu{border-left:5px solid var(--s1)}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dtop .n{font-family:var(--f-num);font-size:22px;font-weight:600;color:var(--s1);white-space:nowrap}
.dtop .n small{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.dbar{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px}
.dbar span{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-num);font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.dmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.dmeta .oran{font-family:var(--f-num)}
.pill{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px}
.pill.bad{background:var(--s1);color:#fff}
.pill.ok{background:var(--sunk);color:var(--muted)}
.ekod{font-family:var(--f-num);font-weight:600}
.vsec{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.vsec button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-weight:600;color:var(--muted)}
.vsec button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kt th,.kt td{font-size:12.5px;padding:6px 8px}
.kt td:nth-child(2){white-space:normal;min-width:180px}
.kt tr.krow{cursor:pointer}
.kt tr.krow:hover td,.kt tr.on td{background:var(--accent-soft)}
.kt tfoot td{background:var(--sunk);white-space:normal}
.kh{display:flex;flex-direction:column;gap:8px}
#hsheet .dtop{align-items:flex-start}
#hsheet h2{font-size:17px}
.kh .tbl td,.kh .tbl th{font-size:12px;padding:4px 8px}
.row[data-hk]{cursor:pointer}
.row[data-hk]:hover{border-color:var(--accent)}
.pt tr.on td{background:var(--accent-soft)}
.pt td{white-space:normal}
.kazan{margin:0;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--fg);font-size:13.5px}
.uyari{margin:0 0 4px;padding:9px 12px;border-radius:8px;background:var(--accent-soft);color:var(--fg);font-size:13.5px;border:1px solid var(--line)}
.tas{color:var(--accent);font-weight:600;font-size:12px}
.akpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
@media (max-width:520px){.akpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.akpi b{font-size:17px}
.arows{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:64px minmax(0,1fr) 124px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.arow.ahead{background:transparent;border:0;padding:0 10px}
.arow .ag{font-size:13px;font-weight:600}
.arow .at{text-align:right;font-size:13px;display:flex;flex-direction:column;line-height:1.3}
.arow .at small{color:var(--muted);font-family:var(--f-ui);font-size:11.5px}
.tl{position:relative;height:14px;background:var(--sunk);border-radius:7px}
.tl i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl-bar{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--accent)}
.tl-bar.disi{background:var(--c4)}
.saat{white-space:nowrap}
.k-gec{color:var(--s1);font-weight:700}
.k-erken{color:var(--s2);font-weight:700}
.k-disi{color:var(--c4);font-weight:700}
.tl-bos{position:absolute;left:8px;top:-1px;font-size:11px;color:var(--muted)}
.tl-olcek{position:relative;height:14px}
.tl-olcek b{position:absolute;transform:translateX(-50%);font-family:var(--f-num);font-size:11px;font-weight:500;color:var(--muted)}
.atbl td:nth-child(2){min-width:0;white-space:nowrap}
.agrid td,.agrid th{font-size:12px;line-height:1.35;text-align:center}
.agrid td.disi{color:var(--c4);font-weight:600}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
.lbox img{border-radius:14px;align-self:center}
.lbox h2{margin:4px 0 0;text-align:center;font-family:var(--f-head);font-size:22px}
.lbox .status{text-align:center}
.lbox label{font-size:13px;font-weight:600;color:var(--muted)}
.lbox select,.lbox input[type=password]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:17px;width:100%}
.lbox input[type=password]{font-family:var(--f-num);letter-spacing:.08em;text-transform:uppercase}
.lbox .chk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--fg);font-size:14px;margin:4px 0}
.lbox .btn{justify-content:center;padding:12px;font-size:16px}
.lbox .err{min-height:1.2em}
#who{font-size:13px;font-weight:600;color:var(--muted)}

<script>
// ---- Excel -> gün kaydı ----
function kNum(s){
  if(s===null||s===undefined||s==='') return null;
  if(typeof s==='number') return s;
  s=String(s).trim(); const pct=s.endsWith('%');
  const v=parseFloat(s.replace('%','').replace(/\./g,'').replace(',','.'));
  if(isNaN(v)) return null;
  return pct? Math.round(v/100*1e6)/1e6 : v;
}
function kTarih(v){
  if(v===null||v===undefined) return null;
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const m=String(v).match(/(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  return m? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : null;
}
function r6(x){ return Math.round(Number(x||0)*1e6)/1e6; }
function excelOku(XLSX, buf, dosyaAdi){
  const wb=XLSX.read(buf,{type:'array'});
  let tarih=null; const ekipler={}; const hedefler={};
  for(const ad of wb.SheetNames){
    const m=ad.trim().match(/^242.*?(\d{3})$/i); if(!m) continue;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[ad],{header:1,raw:true,defval:null});
    if(!rows.length) continue;
    if(!tarih) tarih=kTarih(rows[0][12]);
    const r=[]; let pp=null, ypp=null;
    for(const row of rows.slice(2)){
      if(typeof row[0]==='number' && row[1] && row[4]!==null && row[4]!==undefined && row[4]!==''){
        const k=String(row[1]).trim();
        if(!hedefler[k]) hedefler[k]={ad:String(row[3]||'').trim(), sk:[4,5,6,7].map(i=>kNum(row[i]))};
        const pay=row[8]===null?null:Number(row[8]), payda=row[9]===null?null:Number(row[9]);
        r.push([k, Number(row[2]), pay, payda, r6(row[10]), row[11]===null?0:Number(row[11]), r6(row[12])]);
      }
      if(row[11]==='PP') pp=row[12];
      if(typeof row[11]==='string' && row[11].trim().startsWith('Yak')) ypp=row[12];
    }
    ekipler[m[1]]={kod:ad.trim(), pp:pp==null?null:Math.round(pp*1e4)/1e4, ypp:ypp==null?null:Math.round(ypp*1e4)/1e4, r};
  }
  if(!tarih && dosyaAdi) tarih=kTarih(dosyaAdi);
  return {tarih, hedefler, ekipler};
}



// ---------- sabitler ----------
const EKIP_BILGI={};
const FIBER=["102","118","119"];
const S={days:{},sel:null,tab:'E',team:null,turns:[],busy:false,ctl:null,staged:[],loaded:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trT=t=>t?t.slice(8,10)+'.'+t.slice(5,7)+'.'+t.slice(0,4):'';
const kisa=t=>t?t.slice(8,10)+'.'+t.slice(5,7):'';
const f2=v=>v==null?'–':Number(v).toFixed(2).replace('.',',');
const pct=v=>v==null?'–':'%'+(v*100).toFixed(1).replace('.',',');
const gunler=()=>Object.keys(S.days).sort();
const notH=v=>v==null?'–':v>=4.1?'A':v>=3.6?'B':'C';
const isim=e=>(EKIP_BILGI[e]||[]).join(', ');

// ---------- hesap ----------
function gerekli(up,th,pay,payda){
  if(up){ if(th>=1) return null; return Math.max(0,Math.ceil((th*payda-pay)/(1-th)-1e-9)); }
  if(th<=0) return null; return Math.max(0,Math.ceil(pay/th-payda-1e-9));
}
function dusme(up,th,pay,payda){
  if(up){ if(th<=0) return null; return Math.max(1,Math.floor(pay/th-payda+1e-9)+1); }
  if(th>=1) return null; return Math.max(1,Math.floor((th*payda-pay)/(1-th)+1e-9)+1);
}
function ekipAnaliz(gun,e){
  const t=gun&&gun.ekipler[e]; if(!t) return null;
  const rows=t.r.map(([k,w,pay,payda,oran,skor,puan,tas])=>{
    const h=gun.hedefler[k]||{ad:k,sk:[0,0,0,0]}; const sk=h.sk; const up=sk[3]>=sk[0];
    const veri=payda>0; skor=Number(skor)||0;
    const kayip=veri&&skor>0?Math.round(w*(5-skor)*100)/100:null;
    let sonraki=null,risk=null;
    if(veri&&skor>=1&&skor<=4) sonraki=gerekli(up,sk[skor-1],pay,payda);
    if(veri&&skor>=2) risk=dusme(up,sk[skor-2],pay,payda);
    return {k,ad:h.ad,w,sk,up,pay,payda,oran,skor,puan,veri,kayip,sonraki,risk,tas:!!tas};
  });
  rows.forEach(r=>r.plan=planHesap(r,gun.tarih));
  return {...t,rows};
}
function skorBul(up,sk,o){let s=1;for(let i=0;i<4;i++){if(up?o>=sk[i]-1e-9:o<=sk[i]+1e-9)s=i+2;}return s;}
const sonSkor=(r,k,iyi)=>{const pay=r.up?(iyi?r.pay+k:r.pay):(iyi?r.pay:r.pay+k);return skorBul(r.up,r.sk,pay/(r.payda+k));};
const sonrakiTxt=r=>r.sonraki==null?(r.skor===5?'tavan (5)':'–'):`+${r.sonraki} ${r.up?'başarılı':'sorunsuz'} iş → ${sonSkor(r,r.sonraki,true)}`;
const riskTxt=r=>r.risk==null?'–':`${r.risk} ${r.up?'başarısız':'sorunlu'} işte → ${sonSkor(r,r.risk,false)}`;
const skalaTxt=sk=>sk.map(v=>v<=1.5?(v*100).toFixed(1).replace('.0',''):v).join('/')+(sk[0]<=1.5?'%':'');
function oncekiGun(t){const g=gunler();const i=g.indexOf(t);return i>0?g[i-1]:null;}

// ---------- yükseltme planı ----------
function ayBilgi(t){const y=+t.slice(0,4),m=+t.slice(5,7),d=+t.slice(8,10);return {gun:d,kalan:new Date(y,m,0).getDate()-d};}
function planHesap(r,t){
  if(!r.veri||r.skor<1||r.skor>=5||!t||r.k==='NVS') return null;
  const {gun,kalan}=ayBilgi(t); const hiz=gun>0?r.payda/gun:0;
  const lv=[];
  for(let L=r.skor+1;L<=5;L++){
    const k=gerekli(r.up,r.sk[L-2],r.pay,r.payda);
    const kaz=Math.round(r.w*(L-r.skor)*100)/100;
    const gs=k==null?null:(hiz>0?Math.max(1,Math.ceil(k/hiz)):null);
    lv.push({L,k,kaz,gs,ulasir:k!=null&&k>0&&gs!=null&&gs<=kalan});
  }
  const uy=lv.filter(x=>x.ulasir); let oneri=null;
  if(uy.length){const en=Math.max(...uy.map(x=>x.kaz/x.k)); oneri=uy.filter(x=>x.kaz/x.k>=en*0.75).pop();}
  return {lv,oneri,hiz,kalan};
}
const isAd=r=>r.up?'başarılı':'sorunsuz';
const haftaTxt=r=>{const p=r.plan; if(!p||!(p.hiz>0)) return ''; const n=Math.max(5,Math.round(p.hiz*7)); const o=r.up?(r.pay+n)/(r.payda+n):r.pay/(r.payda+n); return `1 haftalık ${isAd(r)} işle (≈${n} iş) oran ${pct(r.oran)} → ${pct(o)}`;};
const oneriTxt=r=>{const p=r.plan; if(!p) return r.skor===5?'tavan (5)':'–';
  if(!p.oneri){const ilk=p.lv.find(x=>x.k!=null); return (ilk?`uzun vadeli hedef: +${ilk.k} ${isAd(r)} iş → ${ilk.L} · `:'')+haftaTxt(r);}
  return `öneri: +${p.oneri.k} ${isAd(r)} iş → ${p.oneri.L} (+${f2(p.oneri.kaz)} puan${p.oneri.gs?', ≈'+p.oneri.gs+' gün':''})`;};
const planKisa=r=>{const p=r.plan; if(!p) return r.skor===5?'tavan':'–'; return p.lv.map(x=>`${x.L}:${x.k==null?'hatasız olmalı':'+'+x.k}`).join(' ')+(p.oneri?` | öneri ${p.oneri.L}`:` | uzun vadeli hedef; ${haftaTxt(r)}`);};
function planHTML(r){
  const p=r.plan; if(!p) return r.skor===5?'<p class="status" style="margin:0">Skor zaten 5 (tavan).</p>':r.k==='NVS'?'<p class="status" style="margin:0">NVS müşteri anketi puanıdır; iş sayısıyla hesaplanamaz.</p>':'';
  const satir=x=>`<tr${p.oneri&&p.oneri.L===x.L?' class="on"':''}><td><span class="sc s${x.L}">${x.L}</span>${p.oneri&&p.oneri.L===x.L?' <b>önerilen</b>':''}</td><td class="num">${x.k==null?'hatasız olmalı':'+'+x.k+' iş'}</td><td class="num">+${f2(x.kaz)}</td><td class="num">${x.k==null?'–':x.gs==null?'–':'≈'+x.gs+' gün'+(x.ulasir?'':' (uzun vadeli)')}</td></tr>`;
  return `<p class="sect" style="margin:0">Yükseltme planı</p>
   <div class="tw"><table class="tbl pt"><thead><tr><th>Hedef skor</th><th>${r.up?'Başarılı':'Sorunsuz'} iş</th><th>Puan kazancı</th><th>Tahmini süre</th></tr></thead><tbody>${p.lv.map(satir).join('')}</tbody></table></div>
   <p class="status" style="margin:0">Bundan sonraki işlerin hepsinin ${isAd(r)} olduğu varsayılır; araya giren her olumsuz iş gereken sayıyı artırır. Bu hedefte günde ortalama ${String(Math.round(p.hiz*10)/10).replace('.',',')} iş yapılıyor, ay sonuna ${p.kalan} gün var.${p.oneri?` Önerilen seviye, iş başına en çok puan getiren ve bu ay yetişebilecek en yüksek seviyedir.`:''}</p>${p.oneri?'':`<p class="kazan">Her ${isAd(r)} iş oranı iyileştirir, her olumsuz iş hedefi uzaklaştırır. ${esc(haftaTxt(r))}.</p>`}`;
}

// ---------- araç takip ----------
const GUNAD=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const TL0=300, TL1=1380; // zaman çizelgesi 05:00–23:00
const GEC_DK=525, ERKEN_DK=1050; // 08:45'ten sonra açılış = geç (kırmızı), 17:30'dan önce kapanış = erken (turuncu)
const saatHTML=x=>`<span class="saat"><span class="${x.gec?'k-gec':''}">${dkTxt(x.i)}</span>–<span class="${x.erken?'k-erken':''}">${dkTxt(x.s)}</span></span>`;
function saatDk(s){if(!s) return null; const m=String(s).match(/^(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null;}
const dkTxt=d=>d==null?'–':String(Math.floor(d/60)).padStart(2,'0')+':'+String(Math.round(d%60)).padStart(2,'0');
const sureTxt=d=>d==null?'–':Math.floor(d/60)+' sa '+String(Math.round(d%60)).padStart(2,'0')+' dk';
const gunEt=t=>{const d=new Date(t+'T12:00:00');return GUNAD[d.getDay()]+' '+kisa(t);};
const aracHaftalar=()=>Object.keys(S.arac||{}).sort();
function aracOzet(a,gunlerL){
  const v=gunlerL.map(t=>{const x=a.g[t]||[]; const i=saatDk(x[0]), s=saatDk(x[1]);
    const sure=(i!=null&&s!=null&&s>i)?s-i:null; const disi=(i!=null&&i<360)||(s!=null&&s>1200); return {t,i,s,sure,disi,gec:!disi&&i!=null&&i>GEC_DK,erken:!disi&&s!=null&&s<ERKEN_DK};});
  const kul=v.filter(x=>x.sure!=null); let ok=kul.filter(x=>!x.disi); if(!ok.length) ok=kul; const ort=k=>ok.length?ok.reduce((p,x)=>p+x[k],0)/ok.length:null;
  return {v,gun:kul.length,ortI:ort('i'),ortS:ort('s'),ortSure:ort('sure'),disi:v.filter(x=>x.disi).length,gec:v.filter(x=>x.gec).length,erken:v.filter(x=>x.erken).length};
}
function zamanCubuk(x){
  if(x.i==null&&x.s==null) return '<div class="tl"><span class="tl-bos">kontak yok</span></div>';
  const kl=m=>Math.min(TL1,Math.max(TL0,m)); const i=x.i??x.s, s=x.s??x.i; const a=kl(Math.min(i,s)), b=kl(Math.max(i,s));
  const L=(a-TL0)/(TL1-TL0)*100, W=Math.max(1.5,(b-a)/(TL1-TL0)*100);
  const tick=h=>`<i style="left:${(h*60-TL0)/(TL1-TL0)*100}%"></i>`;
  return `<div class="tl">${[8,12,17].map(tick).join('')}<span class="tl-bar${x.disi?' disi':''}" style="left:${L}%;width:${W}%"></span></div>`;
}
function renderArac(){
  const v=$('viewR'); const hs=aracHaftalar();
  if(!hs.length){v.innerHTML=`<div class="empty">${S.loaded?'Henüz araç takip raporu yüklenmedi.':'Veriler yükleniyor…'}</div>`;return;}
  if(!S.hafta||!S.arac[S.hafta]) S.hafta=hs[hs.length-1];
  const H=S.arac[S.hafta]; const sec=`<select class="day" id="haftaSel" aria-label="Hafta seç">${hs.slice().reverse().map(h=>`<option value="${h}"${h===S.hafta?' selected':''}>${kisa(S.arac[h].hafta)}–${trT(S.arac[h].bitis)}</option>`).join('')}</select>`;
  const araclar=H.araclar.filter(a=>S.mod!=='ekip'||a.ekip===S.ekip);
  const tek=S.mod==='ekip'?araclar[0]:araclar.find(a=>a.plaka===S.aracSec);
  if(!araclar.length){v.innerHTML=`<div class="lhead"><p class="sect">Araç takip</p>${sec}</div><div class="empty">Bu haftanın raporunda ekibine ait araç bulunamadı.</div>`;return;}
  if(tek){
    const o=aracOzet(tek,H.gunler);
    v.innerHTML=`<div class="detail">
      <div class="lhead"><p class="sect">Araç takip · haftalık kontak</p>${sec}</div>
      ${S.mod==='ekip'?'':'<div><button class="btn" type="button" data-aracgeri="1">← Tüm araçlar</button></div>'}
      <div class="dhead"><span class="no">${esc(tek.ekip||'?')}</span><div class="kpi"><small>Plaka</small><b>${esc(tek.plaka)}</b></div><div class="kpi"><small>Kullanıcı</small><span>${esc(tek.kisi)}</span></div></div>
      <div class="akpi"><div class="kpi"><small>Ort. ilk kontak</small><b>${dkTxt(o.ortI)}</b></div><div class="kpi"><small>Ort. son kontak</small><b>${dkTxt(o.ortS)}</b></div><div class="kpi"><small>Ort. kullanım</small><b>${sureTxt(o.ortSure)}</b></div><div class="kpi"><small>Kullanılan gün</small><b>${o.gun}/${H.gunler.length}</b></div><div class="kpi"><small>Geç çıkış (08:45 sonrası)</small><b class="${o.gec?'k-gec':''}">${o.gec} gün</b></div><div class="kpi"><small>Erken dönüş (17:30 öncesi)</small><b class="${o.erken?'k-erken':''}">${o.erken} gün</b></div></div>
      <div class="arows"><div class="arow ahead"><span></span><span class="tl-olcek"><b style="left:${(480-TL0)/(TL1-TL0)*100}%">08</b><b style="left:${(720-TL0)/(TL1-TL0)*100}%">12</b><b style="left:${(1020-TL0)/(TL1-TL0)*100}%">17</b></span><span></span></div>
      ${o.v.map(x=>`<div class="arow"><span class="ag">${gunEt(x.t)}</span>${zamanCubuk(x)}<span class="at num">${x.i==null&&x.s==null?'–':saatHTML(x)}<small>${x.sure!=null?sureTxt(x.sure):''}${x.disi?' · mesai dışı':''}${x.gec?' · <b class="k-gec">geç çıkış</b>':''}${x.erken?' · <b class="k-erken">erken dönüş</b>':''}</small></span></div>`).join('')}</div>
      <p class="status">Saatler araç takip sistemindeki ilk kontak açma ve son kontak kapama kayıtlarıdır. Aradaki süre aracın gün içindeki kullanım aralığını gösterir; kesintisiz sürüş anlamına gelmez. <span class="k-gec">Kırmızı</span>: 08:45'ten sonra kontak açma. <span class="k-erken">Turuncu</span>: 17:30'dan önce kontak kapama. <span class="k-disi">Mor</span>: 06:00 öncesi ya da 20:00 sonrası kontak (mesai dışı); ortalamalara katılmaz.</p>
    </div>`;
    return;
  }

    out.push('Ekip toplamları (backlog hariç): '+dg.ekipler.map(([e,n])=>e+': '+n).join(', '));}
  {const hs=Object.keys(S.arac||{}).sort(); if(hs.length){const H=S.arac[hs[hs.length-1]]; out.push(`\nARAÇ TAKİP (${trT(H.hafta)}–${trT(H.bitis)}, ilk kontak açma / son kontak kapama; 06:00 öncesi ve 20:00 sonrası mesai dışı):`); for(const a of H.araclar){const o=aracOzet(a,H.gunler); out.push(`${a.ekip||'?'} ${a.plaka}: ort. ilk ${dkTxt(o.ortI)}, ort. son ${dkTxt(o.ortS)}, ort. kullanım ${sureTxt(o.ortSure)}, ${o.gun}/${H.gunler.length} gün, geç çıkış (08:45 sonrası) ${o.gec} gün, erken dönüş (17:30 öncesi) ${o.erken} gün, mesai dışı ${o.disi} | `+H.gunler.map(t=>{const x=a.g[t]||[];return kisa(t)+' '+(x[0]||'-')+'-'+(x[1]||'-');}).join(', '));}}}

// ---------- çizim ----------
function grafikCiz(spec){
  const x=(spec.x||[]).map(String); const ser=(spec.seriler||[]).filter(s=>Array.isArray(s.degerler)).slice(0,6);
  const vals=ser.flatMap(s=>s.degerler).filter(v=>typeof v==='number'&&isFinite(v));
  if(!x.length||!vals.length) return null;
  const bar=spec.tip==='cubuk'; const W=Math.round(Math.max(320,Math.min(640,innerWidth-70))),H=Math.round(W*.5),L=46,R=14,T=12,B=34;
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(bar) mn=Math.min(0,mn); else {const p=(mx-mn)*.12||Math.abs(mx)*.1||1; mn-=p; mx+=p;}
  if(mx===mn) mx=mn+1;
  const step=niceStep((mx-mn)/4); const y0=Math.floor(mn/step)*step, y1=Math.ceil(mx/step)*step;
  const sy=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0)); const pw=(W-L-R)/x.length; const sx=i=>L+pw*(i+.5);
  const u=spec.birim||''; const fmt=v=>(Math.round(v*100)/100).toString().replace('.',',')+(u==='%'?'%':'');
  let g='';
  for(let v=y0;v<=y1+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--f-num)">${esc(fmt(v))}</text>`;}
  const every=Math.ceil(x.length/Math.max(3,Math.floor((W-L-R)/50)));
  x.forEach((l,i)=>{ if(i%every===0||i===x.length-1) g+=`<text x="${sx(i)}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--f-num)">${esc(l)}</text>`;});
  ser.forEach((s,si)=>{const c=`var(--c${si+1})`;
    if(bar){const bw=pw*.72/ser.length; s.degerler.forEach((v,i)=>{ if(typeof v!=='number') return; const xx=sx(i)-pw*.36+bw*si; const ya=sy(Math.max(v,0)),yb=sy(Math.min(v,0)); g+=`<rect x="${xx}" y="${ya}" width="${Math.max(1,bw-1)}" height="${Math.max(1,yb-ya)}" fill="${c}" rx="2"><title>${esc(s.ad)} ${esc(x[i])}: ${esc(fmt(v))}</title></rect>`;});}
    else{const pts=s.degerler.map((v,i)=>typeof v==='number'?`${sx(i)},${sy(v)}`:null).filter(Boolean); g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>`;
      s.degerler.forEach((v,i)=>{ if(typeof v!=='number')return; const last=i===s.degerler.length-1; g+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="${last?4:2.4}" fill="${c}"><title>${esc(s.ad)} ${esc(x[i])}: ${esc(fmt(v))}</title></circle>`;});}
  });
  const box=document.createElement('div'); box.className='chart';
  box.innerHTML=(spec.baslik?`<h5>${esc(spec.baslik)}</h5>`:'')+(ser.length>1?`<div class="legend">${ser.map((s,i)=>`<span><i style="background:var(--c${i+1})"></i>${esc(s.ad)}</span>`).join('')}</div>`:'')+`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.baslik||'grafik')}">${g}</svg>`;
  return box;
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function sparkline(vals,w=120,h=30){
  const v=vals.filter(x=>x!=null); if(v.length<2) return '';
  const mn=Math.min(...v),mx=Math.max(...v)||1,rg=(mx-mn)||1;
  const pts=vals.map((x,i)=>x==null?null:[2+(w-4)*i/(vals.length-1),h-3-(h-6)*(x-mn)/rg]).filter(Boolean);
  const l=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.8" vector-effect="non-scaling-stroke"/><circle cx="${l[0]}" cy="${l[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}

// ---------- markdown ----------
function mdYaz(el,text,final){
  if(!window.marked||!window.DOMPurify){el.textContent=text;return;}
  el.innerHTML=DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:false}));
  el.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t);});
  el.querySelectorAll('pre > code').forEach(c=>{
    if(!/language-grafik/.test(c.className)) return;
    const pre=c.parentElement; let node=null;
    try{node=grafikCiz(JSON.parse(c.textContent));}catch(e){}
    if(node) pre.replaceWith(node); else {const p=document.createElement('p');p.className='status';p.textContent=final?'(grafik çizilemedi)':'grafik hazırlanıyor…';pre.replaceWith(p);}
  });
}

// ---------- eksik veriyi önceki günden tamamla ----------
// Sistem kaynaklı toplu boşluk: bir hedef, dün verisi olan ekiplerin en az %75'inde bugün boş (payda 0/boş) geldiyse
// aynı ay içindeki bir önceki günün değeri kullanılır ve PP yeniden hesaplanır. Taşıma, veri geri gelene kadar sürer.
// Taşımanın başlaması için değerin en az 2 gün üst üste gerçek veri olarak gelmiş olması gerekir. Ayın 1'i kaynak sayılmaz.
function tamamlaGunler(days){
  const out={}; let onceki=null, onceki2=null;
  for(const t of Object.keys(days).sort()){
    const g=days[t]; const yeni={...g,ekipler:{},tasinan:{}};
    const ay=x=>!!x&&x.tarih.slice(0,7)===t.slice(0,7);
    const uygun=ay(onceki)&&onceki.tarih.slice(8,10)!=='01';
    const o2=ay(onceki2)?onceki2:null;
    const bul=(d,e,k)=>d&&d.ekipler[e]&&d.ekipler[e].r.find(y=>y[0]===k);
    const toplu=new Set();
    if(uygun) for(const k of Object.keys(g.hedefler||{})){
      let var_=0,bos=0;
      for(const e of Object.keys(g.ekipler)){const p=bul(onceki,e,k); if(!p||!(p[3]>0)) continue; var_++; const r=bul(g,e,k); if(!r||!(r[3]>0)) bos++;}
      if(var_>0&&bos/var_>=0.75) toplu.add(k);
    }
    for(const [e,x] of Object.entries(g.ekipler)){
      let pp=x.pp; const list=[];
      const r=x.r.map(row=>{
        if(row[3]>0||!toplu.has(row[0])) return row;
        const p=bul(onceki,e,row[0]);
        if(!p||!(p[3]>0)) return row;
        if(!p[7]){const p2=bul(o2,e,row[0]); if(!p2||!(p2[3]>0)) return row;}
        pp=(pp||0)+(p[6]||0)-(row[6]||0); list.push(row[0]);
        return [p[0],p[1],p[2],p[3],p[4],p[5],p[6],(p[7]||0)+1];
      });
      yeni.ekipler[e]={...x,r,pp:pp==null?null:Math.round(pp*1e4)/1e4,ppHam:x.pp};
      if(list.length) yeni.tasinan[e]=list;
    }
    out[t]=yeni; onceki2=onceki; onceki=yeni;
  }
  return out;
}
function eksikKodlar(t){const g=S.days[t]; if(!g||!g.tasinan) return []; return [...new Set(Object.values(g.tasinan).flat())];}
function eksikNotu(){const k=eksikKodlar(S.sel); if(!k.length) return '';
  return `<p class="uyari">↺ ${trT(S.sel)} dosyasında <b>${k.map(x=>esc(KISA[x]||x)).join(', ')}</b> verisi boş geldi. Bu hedeflerde bir önceki günün değeri kullanıldı ve PP buna göre hesaplandı.</p>`;}

const KISA={T4:'İnternet kurulum süresi',T7:'TV kurulum süresi',T8:'Başarılı dönüşüm',T13:'Arıza giderme süresi',T14:'Backlog',T16:'TV arıza giderme süresi',T19:'İlk randevuya uyum',T25:'İnternet kurulum tamamlanma',T27:'TV kurulum tamamlanma',T28:'Dönüşüm sonrası erken arıza',T29:'Dönüşüm süresine uyum',T32:'Ev içi destek tekrar arıza',T33:'Tekrar eden arıza',T34:'IPTV tekrar eden arıza',T36:'Erken arıza – internet',T37:'Kronik arıza',T39:'Erken arıza – IPTV',T70:'Ses kurulum süresi',T71:'Ses arıza giderme süresi',T99:'TV randevuya uyum',NVS:'NVS'};
function degisim(t){
  const dun=oncekiGun(t); if(!dun) return null; const y=S.days[dun], g=S.days[t];
  const hedefler=[], nvs=[], top={};
  for(const [k,h] of Object.entries(g.hedefler)){
    const up=h.sk[3]>=h.sk[0]; const ek=Object.keys(g.ekipler).sort();
    const rw=(d,e)=>d.ekipler[e]?.r.find(r=>r[0]===k);
    if(k==='NVS'){for(const e of ek){const a=rw(g,e),b=rw(y,e);if(a&&b&&a[3]>0&&b[3]>0&&a[2]<b[2])nvs.push([e,b[2]-a[2]]);}continue;}
    const sig=d=>new Set(ek.map(e=>JSON.stringify((rw(d,e)||[]).slice(2,4)))).size===1;
    const ortak=g.ortak?g.ortak.includes(k):(sig(g)&&sig(y)); const bad=r=>up?((r[3]||0)-(r[2]||0)):(r[2]||0);
    let tot=0,yP=0,yD=0,tP=0,tD=0; const by=[];
    for(const e of (ortak?[ek[0]]:ek)){const a=rw(g,e),b=rw(y,e); if(!a||!b) continue;
      const d=bad(a)-bad(b); if(d>0){tot+=d;by.push([ortak?'TM':e,d]); if(!ortak&&k!=='T14') top[e]=(top[e]||0)+d;}
      tP+=a[2]||0;tD+=a[3]||0;yP+=b[2]||0;yD+=b[3]||0;}
    if(!tot) continue; by.sort((p,q)=>q[1]-p[1]);
    const yo=yD?yP/yD:null,to=tD?tP/tD:null; const kotu=yo!=null&&to!=null&&(up?to<yo-1e-9:to>yo+1e-9);
    hedefler.push({k,ad:h.ad,up,tot,by,yo,to,kotu,ortak});
  }
  hedefler.sort((a,b)=>(b.kotu-a.kotu)||(b.tot-a.tot));
  const ekipler=Object.entries(top).sort((a,b)=>b[1]-a[1]);
  return {dun,hedefler,nvs,ekipler};
}

  const kotuN=dg.hedefler.filter(o=>o.kotu).length;

    return `<div class="dcard${o.kotu?' kotu':''}"><div class="dtop"><h3>${esc(KISA[o.k]||o.ad)} <span class="ekod" style="color:var(--muted);font-size:12.5px">${o.k}</span></h3><span class="n">+${o.tot}<small>${o.up?'hedef dışı iş':'yeni kayıt'}</small></span></div>

  h+=`<p class="status">Uyum ve tamamlanma hedeflerinde hedef dışı iş (payda − pay) artışı, arıza ve backlog hedeflerinde yeni kayıt (pay) artışı sayılır. Kırmızı kenarlı kartlarda ${S.mod==='ekip'?'oran':'müdürlük toplam oranı'} kötüleşti.</p></div>`;

const HATA={not_granted:'Asistanın Claude kullanmasına izin verilmedi. Sayfayı yenileyip izin verebilirsin.',sampling_disabled:'Bu hesapta asistan kullanılamıyor.',rate_limited:'Çok sık soru gönderildi ya da kullanım sınırına gelindi. Biraz sonra tekrar dene.',session_expired:'Oturum süresi dolmuş, tekrar giriş yap.',prompt_too_large:'Soru ya da veri çok büyük. Daha dar bir soru sor.',refused:'Bu soru yanıtlanamadı, farklı sor.',empty_completion:'Boş cevap geldi, soruyu sadeleştir.',tools_unavailable:'Bu görünümde geçmiş verilere erişim aracı çalışmıyor.'};
async function sor(q){
  q=q.trim(); if(!q||S.busy) return;
  const sample=await S.sampleP;
  if(!S.days[S.sel]){balon('ai','<p class="status">Önce en az bir günün Excel dosyasını yükle.</p>');return;}
  balon('user').textContent=q; $('q').value=''; autoSize();
  const ai=balon('ai'); const body=document.createElement('div'); body.className='md'; ai.appendChild(body);
  if(!sample){body.innerHTML='<p class="status">Asistan bu görünümde çalışmıyor. Sayfayı claude.ai içinde aç. Ekipler sekmesi yine de çalışır.</p>';return;}
  const think=document.createElement('p'); think.className='think'; think.textContent='Düşünüyor…'; body.appendChild(think); uyariEl=think;
  ai.scrollIntoView({block:'start',behavior:'smooth'});
  S.busy=true; $('sendBtn').hidden=true; $('stopBtn').hidden=false; S.ctl=new AbortController();
  const gecmis=S.turns.slice(-6);
  const input=[{role:'user',content:KURALLAR+veriBlogu(S.sel)},...gecmis,{role:'user',content:q}];
  const lim=await sample.limits().catch(()=>null);
  const opts={signal:S.ctl.signal,cache:false,onText:({text})=>{uyariEl=null;mdYaz(body,text,false);}};
  if(lim&&lim.tools){opts.tools=ARACLAR; delete opts.cache;}
  try{
    const {text,truncated}=await sample(input,opts);
    mdYaz(body,text,true); if(truncated){const n=document.createElement('p');n.className='status';n.textContent='Cevap kesildi; daha dar bir soru sor.';ai.appendChild(n);}
    S.turns.push({role:'user',content:q},{role:'assistant',content:text});
  }catch(e){
    if(e&&e.text) mdYaz(body,e.text,true); else body.innerHTML='';
    if(e&&e.code!=='cancelled'){const n=document.createElement('p');n.className='status err';n.textContent=HATA[e.code]||'Bağlantı sorunu oldu, tekrar dene.';ai.appendChild(n);}
    else if(!e.text) body.innerHTML='<p class="status">Durduruldu.</p>';
  }finally{S.busy=false;S.ctl=null;uyariEl=null;$('sendBtn').hidden=false;$('stopBtn').hidden=true;}
}

  if(e.target.closest('#back')){S.team=null;S.acik=null;renderEkipler();return;}
  if(e.target.closest('#askTeam')){const t=S.team;sekme('A');sor(`${t} ekibinin en kötü olduğu hedefleri sırala ve detaylı analizini yap`);return;}
  const b=e.target.closest('[data-team]');if(b){S.team=b.dataset.team;S.acik=null;renderEkipler();window.scrollTo({top:0});}
});
$('full').addEventListener('click',e=>{
  if(e.target.closest('#fullClose')){$('full').hidden=true;return;}
  const b=e.target.closest('[data-team]');if(b){$('full').hidden=true;S.team=b.dataset.team;renderEkipler();window.scrollTo({top:0});}
});

$('hClose').onclick=gecmisKapat;
$('hsheet').addEventListener('click',e=>{if(e.target.id==='hsheet')gecmisKapat();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('hsheet').hidden)gecmisKapat();});

$('q').addEventListener('input',autoSize);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sor($('q').value);}});
$('stopBtn').onclick=()=>S.ctl&&S.ctl.abort();

render();
// ---------- giriş ve şifre çözme ----------
const GKEY='karne-giris';
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function coz(kim,sifre){
  const r=await fetch('data/'+kim+'.json',{cache:'no-store'}); if(!r.ok) throw new Error('veri');
  const p=await r.json();
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(sifre)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt; try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));}catch(e){throw new Error('sifre');}
  return JSON.parse(new TextDecoder().decode(pt));
}
function oturumAc(v){
  S.mod=v.mod; S.ekip=v.ekip||null; S.days=tamamlaGunler(v.gunler||{}); S.arac=v.arac||{}; S.loaded=true; S.team=null;
  S.sel=gunler().slice(-1)[0]||null;
  $('tabE').textContent=S.mod==='ekip'?'Karnem':'Ekipler';
  $('who').textContent=S.mod==='ekip'?S.ekip+' ekibi':'Yönetici';
  $('who').hidden=false; $('cikis').hidden=false; $('login').hidden=true;
  setDurum(''); sekme('E'); render();
}
async function girisYap(kim,sifre,hatirla,sessiz){
  $('lBtn').disabled=true; $('lBtn').textContent='Açılıyor…'; $('lHata').textContent='';
  try{
    const v=await coz(kim,sifre);
    if(hatirla){try{localStorage.setItem(GKEY,JSON.stringify({kim,sifre:norm(sifre)}));}catch(e){}}
    oturumAc(v);
  }catch(e){
    if(sessiz){try{localStorage.removeItem(GKEY);}catch(x){}}
    else $('lHata').textContent=e.message==='sifre'?'Şifre yanlış. Ekibi ve şifreyi kontrol et.':'Veriye ulaşılamadı. İnternet bağlantını kontrol et.';
    $('login').hidden=false;
  }finally{$('lBtn').disabled=false;$('lBtn').textContent='Giriş';}
}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();const s=$('lSifre').value;if(!norm(s)){$('lHata').textContent='Şifreyi yaz.';return;}girisYap($('lEkip').value,s,$('lHatirla').checked,false);});
$('cikis').onclick=()=>{try{localStorage.removeItem(GKEY);}catch(e){} location.reload();};
S.sampleP=Promise.resolve(null);
(()=>{let g=null;try{g=JSON.parse(localStorage.getItem(GKEY)||'null');}catch(e){}
  if(g&&g.kim&&g.sifre){$('lEkip').value=g.kim;girisYap(g.kim,g.sifre,true,true);} else $('login').hidden=false;})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
